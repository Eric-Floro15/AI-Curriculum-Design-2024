# Orchestrator end-to-end eval — golden queries.
#
# Each query specifies what a passing run of the full 5-agent crew
# (Orchestrator + Analyst + University Programs + News + Cluster
# Interpreter) must produce.
#
# REPRODUCIBILITY WORKFLOW (see chatbot/eval/README.md for full notes):
#
#   1. To add/edit a query: edit this file. Each entry takes 5 fields
#      (id, query, must_delegate_to, expected_substrings,
#      forbidden_substrings, budget).
#   2. To re-run the baseline: `KMP_DUPLICATE_LIB_OK=TRUE
#      python3 chatbot/eval/run_orchestrator_eval.py`. Each query's full
#      response and PASS/FAIL grades are written to a dated snapshot file
#      `orchestrator_baseline_YYYY-MM-DD_<model>.md` in this folder.
#   3. To update assertions after a real run: open the latest snapshot,
#      copy the substrings that should be required into expected_substrings
#      here, then re-run to verify.
#
# Assertion types per query:
#   - must_delegate_to       sub-agent role names the Orchestrator MUST
#                            consult. Empty list means "no delegation
#                            required" (e.g. for off-scope queries the
#                            Orchestrator should redirect, not fan out).
#   - expected_substrings    strings that MUST appear (case-insensitive)
#                            in the Orchestrator's final answer.
#                            Conservative — only includes facts derivable
#                            from the data (real frequencies, real URLs,
#                            structural elements required by OUTPUT FORMAT).
#                            Refine after the first baseline run.
#   - forbidden_substrings   strings that must NOT appear. Drawn from the
#                            full failure-mode catalog observed across
#                            all the 2026-05-26 test runs.
#
# Budget per query:
#   - max_tool_calls         total step_callback invocations across the crew.
#                            NOTE: step_callback fires on ALL CrewAI steps
#                            (reasoning, tool calls, responses) — not only
#                            external tool dispatches. Recalibrated 2026-07-14
#                            after first live Sonnet 4.6 run showed 63 steps /
#                            666s for a 3-specialist query (vs. old estimate of
#                            ≈30 based on max_iter caps alone). New baselines:
#                            ~70 steps / ~900s per single-specialist query;
#                            ~90 steps / ~1200s per 3-specialist query.
#   - max_wall_time_sec      hard cap on a single query's runtime.

# ── Shared baseline forbidden substrings (referenced by anchors below) ──
# These are the known failure modes documented across all the 2026-05-26
# test runs. Every query should reject these. This entry is filtered out
# of the runner (`id` starts with `_`) — it only exists to define the
# anchor used by the real queries below.
- id: _baseline_forbidden
  forbidden_substrings: &SHARED_FORBIDDEN
    # qwen2.5:14b fabricated Queen's MMAI URL (2026-05-26 capped-Sonnet
    # comparison run).
    - "courseleaf.com"
    # Llama 3.1 8B typo of "MMAI" (Run 2 of 2026-05-26).
    - "MMOAI"
    # Llama 3.1 8B placeholder hallucination (Run 1 of 2026-05-26).
    - "(URL to come from"
    # Tool-call-JSON leaks — emitted as final-answer text by Llama 3.1 8B
    # (Runs 3-4 of 2026-05-26).
    - '"name": "delegate_work_to_coworker"'
    - '"name": "ask_question_to_coworker"'
    - '"name": "skills_in_cluster"'
    - '"name": "ai_news_rag"'
    # Specific fabricated artifacts observed on bad runs.
    - "mmaiqc.ca"       # invented domain (Run 1, Llama 3.1 8B)
    - "MTC-6502"        # invented course code (Run 1, Llama 3.1 8B)

# ============================================================================
# QUERIES
# ============================================================================

# ── INFO QUERIES (single-specialist may be sufficient) ──────────────────

- id: pure-market-soft-skills
  query: "What are the top 5 most in-demand soft skills for AI/ML graduates? Give me specific frequencies from your data."
  category: info-market
  must_delegate_to:
    - Skills Taxonomy Analyst
  expected_substrings:
    - "Communication"
    - "soft"
  forbidden_substrings: *SHARED_FORBIDDEN
  budget:
    max_tool_calls: 70    # recalibrated 2026-07-14: observed 63 steps on a 3-specialist run
    max_wall_time_sec: 900  # observed 667s; +33% headroom

- id: pure-peer-mit
  query: "What does MIT's AI / data science Master's program offer? Cite specific URLs for the program page."
  category: info-peer
  must_delegate_to:
    - University AI Programs Researcher
  expected_substrings:
    - "MIT"
    - "mit.edu"
  forbidden_substrings: *SHARED_FORBIDDEN
  budget:
    max_tool_calls: 70    # recalibrated 2026-07-14 (single-specialist, Sonnet 4.6 baseline)
    max_wall_time_sec: 900

- id: pure-news-ai-agents
  query: "What are the most important recent developments in AI agents according to the indexed news?"
  category: info-news
  must_delegate_to:
    - AI Industry News Researcher
  expected_substrings:
    # The answer must be about AI agents — the corpus covers this topic well.
    - "agent"
    # Removed: "HuggingFace" — qwen's synthesis often cites article content
    # without explicitly naming the source publication.
  forbidden_substrings:
    - "courseleaf.com"
    - "MMOAI"
    - "(URL to come from"
    - '"name": "ai_news_rag"'
    # Off-corpus hallucinations from the news_offcorpus_queries probes:
    - "Quantum AI Quarterly"
    - "RadiologyAI Quarterly"
  budget:
    max_tool_calls: 70    # recalibrated 2026-07-14 (single-specialist, Sonnet 4.6 baseline)
    max_wall_time_sec: 900

# ── UPDATE / DESIGN QUERIES (all three specialists required) ────────────

- id: data-eng-curriculum-update
  query: |
    I'm updating my AI/ML Master's curriculum. What are the most
    in-demand data engineering skills I should make sure my program
    covers, and how does Queen's University's MMAI program compare
    on this dimension? Give me concrete recommendations for what to
    add or strengthen.
  category: update-mixed
  # This is the canonical reference query. Full known-good answer
  # documented in orchestrator_baseline_2026-05-26_sonnet.md.
  must_delegate_to:
    - Skills Taxonomy Analyst
    - University AI Programs Researcher
    - AI Industry News Researcher
  expected_substrings:
    # Core data-engineering skills — any grounded answer must surface these.
    - "Data Pipelines"
    - "4,278"         # top frequency (comma-normalised by runner)
    - "DevOps"
    - "Big Data"
    # Queen's MMAI was explicitly asked about — answer must reference it.
    - "Queen"         # relaxed from "smith.queensu.ca": URL is Sonnet-specific
    # Removed: "Data Management" / "1,587" — secondary metric, not always cited
    # Removed: "CMU" — Sonnet spontaneously added it; query never asked for it
    # Removed: "Executive Summary" / "Trade-off" — style headings, not content;
    #          qwen uses "Recommendations" / "Conclusion" / "Caveats" instead
  forbidden_substrings: *SHARED_FORBIDDEN
  budget:
    max_tool_calls: 90    # recalibrated 2026-07-14: 3-specialist run, ~1.4× observed 63-step baseline
    max_wall_time_sec: 1200

- id: soft-skills-curriculum-update
  query: |
    I want to strengthen the soft skills component of my AI/ML
    Master's program. Which soft skills are most in demand, what do
    peer programs do here, and have there been recent industry
    developments that should shape my approach?
  category: update-mixed
  # Update query — all three specialists required.
  must_delegate_to:
    - Skills Taxonomy Analyst
    - University AI Programs Researcher
    - AI Industry News Researcher
  expected_substrings:
    - "Communication"
    - "39,040"        # comma-normalised by runner: also matches "39040"
    # Removed: "Trade-off" — qwen writes "Trade-off/Caveat" which the runner
    # already matches case-insensitively, but removing avoids fragility if
    # the model uses "Considerations" or "Caveats" on a future run.
  forbidden_substrings: *SHARED_FORBIDDEN
  budget:
    max_tool_calls: 90    # recalibrated 2026-07-14: 3-specialist
    max_wall_time_sec: 1200

- id: mlops-coverage-benchmark
  query: |
    I'm considering adding a dedicated MLOps module to my AI/ML
    Master's. How strong is the market demand, how do peer
    institutions cover MLOps today, and what recent industry
    developments should shape the module's content?
  category: update-mixed
  must_delegate_to:
    - Skills Taxonomy Analyst
    - University AI Programs Researcher
    - AI Industry News Researcher
  expected_substrings:
    - "MLOps"   # the query topic must appear in the answer
    # Removed: "Trade-off" — style heading; qwen writes "Trade-off/Caveat"
    # which passes, but removing avoids fragility on future runs.
  forbidden_substrings: *SHARED_FORBIDDEN
  budget:
    max_tool_calls: 90    # recalibrated 2026-07-14: 3-specialist
    max_wall_time_sec: 1200

- id: cloud-infra-curriculum
  query: |
    Should I add a cloud infrastructure module to my AI/ML Master's
    curriculum? Compare the in-demand cloud skills in the job market
    with how major peer programs teach cloud, and note any recent
    cloud-AI developments worth including.
  category: update-mixed
  must_delegate_to:
    - Skills Taxonomy Analyst
    - University AI Programs Researcher
    - AI Industry News Researcher
  expected_substrings:
    # Known high-frequency cloud skills (Cluster 4).
    - "AWS"
    - "Azure"
    - "cloud"
    # Removed: "Trade-off" — style heading, same reasoning as other queries.
  forbidden_substrings: *SHARED_FORBIDDEN
  budget:
    max_tool_calls: 90    # recalibrated 2026-07-14: 3-specialist
    max_wall_time_sec: 1200

- id: broad-improve-curriculum
  query: "I want to improve my AI/ML Master's curriculum. What should I focus on?"
  category: update-broad
  # Deliberately broad query. Tests whether the Orchestrator can
  # still produce a focused, grounded recommendation rather than a
  # vague generic answer or a runaway tool-call loop.
  must_delegate_to:
    - Skills Taxonomy Analyst
    - University AI Programs Researcher
    - AI Industry News Researcher
  expected_substrings:
    # A broad query should produce a grounded, on-topic answer.
    # We check for minimal content markers only — specific skills cited
    # vary by model (Sonnet surfaces Communication/Data Pipelines; qwen
    # surfaces Data Science/MLOps). Both are valid responses.
    - "AI"          # answer must be about AI/ML, not generic advice
    - "curriculum"  # answer must reference the curriculum-design context
    # Removed: "Communication", "Data Pipelines" — model-specific skill picks
    # Removed: "Executive Summary", "Trade-off" — style headings, not content
  forbidden_substrings: *SHARED_FORBIDDEN
  budget:
    max_tool_calls: 90    # recalibrated 2026-07-14: 3-specialist
    max_wall_time_sec: 1200

# ── EDGE / ADVERSARIAL QUERIES ──────────────────────────────────────────

- id: off-scope-python-tutorial
  query: "Can you teach me Python programming basics step by step?"
  category: edge-off-scope
  # The chatbot is a curriculum-design tool, not a programming tutor.
  # A passing answer either redirects to the actual capability or
  # honestly says this is out of scope. It should NOT fan out
  # delegations to all three specialists.
  must_delegate_to: []   # empty list = no delegation expected
  expected_substrings:
    # The agent should signal scope honestly. Any of these phrasings
    # is acceptable as an honest-redirect signal.
    - "curriculum"   # answer should mention the chatbot's real purpose
  forbidden_substrings:
    # Don't generate a Python tutorial. If we see code blocks or
    # tutorial-style language, the agent went off-scope.
    - "```python"
    - "def "
    - "print("
    - "import "
    - "# Step 1"
    - "courseleaf.com"
    - "MMOAI"
    - '"name": "delegate_work_to_coworker"'
  budget:
    max_tool_calls: 8   # relaxed from 4: qwen uses more tool overhead even
                        # for simple queries; the delegation check (must_delegate_to: [])
                        # is the real gate here, not raw tool count
    max_wall_time_sec: 120

- id: narrow-jax-demand
  query: "How in-demand is JAX as a skill in the current job market? Should I include JAX in my AI/ML curriculum?"
  category: edge-narrow
  # Narrow query about a specific, possibly low-frequency tool.
  # Tests whether the Analyst honestly reports thin coverage rather
  # than inventing a frequency, and whether Univ Programs / News
  # are correctly considered (curriculum-design framing).
  must_delegate_to:
    - Skills Taxonomy Analyst
  expected_substrings:
    - "JAX"
    # The agent should be honest about what frequency JAX has (it
    # might be very low or absent). One of these signals must
    # appear — either a number/frequency, or an honest "not in" /
    # "low frequency" / "limited" signal.
    # Refine after first run.
  forbidden_substrings: *SHARED_FORBIDDEN
  budget:
    max_tool_calls: 70    # recalibrated 2026-07-14 (single-specialist, Sonnet 4.6 baseline)
    max_wall_time_sec: 900

# ── CURRICULUM + CLUSTER QUERIES (new agents) ───────────────────────────────

- id: curriculum-fetch-mmai
  query: "Fetch and structure the publicly available curriculum for Queen's University MMAI program. Return a clean course list with source URLs and the broad topic areas covered. Do not perform gap analysis."
  category: info-curriculum
  # Tests the University AI Programs Researcher in structured-output mode.
  # Should delegate to it alone and return a structured course list —
  # no gap analysis, no skill comparisons.
  must_delegate_to:
    - University AI Programs Researcher
  expected_substrings:
    # Any honest answer about MMAI must mention Queen's and a URL.
    - "Queen"
    - "MMAI"
    # The output format requires a topic areas section.
    - "Topic"
  forbidden_substrings:
    # Gap analysis should NOT appear — that belongs to Cluster Interpreter.
    - "❌ Missing"
    - "gap analysis"
    - "courseleaf.com"
    - "MMOAI"
    - '"name": "delegate_work_to_coworker"'
  budget:
    max_tool_calls: 70    # recalibrated 2026-07-14 (single-specialist, Sonnet 4.6 baseline)
    max_wall_time_sec: 900

- id: curriculum-cluster-gap-analysis
  query: |
    Analyse the Queen's University MMAI program curriculum for skill gaps.
    First fetch the current course list, then use the CSPA ensemble clustering
    results to identify which skill clusters are missing or underrepresented.
    Provide a prioritised list of skills to add, with market-demand frequencies.
  category: update-curriculum
  # Tests the two-agent cooperation: University AI Programs Researcher
  # (structured curriculum fetch) followed by Cluster Interpreter (gap
  # analysis on the fetched curriculum). Both must be called; Orchestrator
  # passes University AI Programs Researcher output as context to Cluster
  # Interpreter.
  must_delegate_to:
    - University AI Programs Researcher
    - Cluster Interpreter
  expected_substrings:
    # University AI Programs Researcher must surface Queen's MMAI
    - "Queen"
    # Cluster Interpreter must reference the cluster analysis
    - "cluster"
    # Output must include at least one concrete missing skill recommendation
    - "Missing"
  forbidden_substrings:
    - "courseleaf.com"
    - "MMOAI"
    - '"name": "delegate_work_to_coworker"'
    - '"name": "ask_question_to_coworker"'
  budget:
    max_tool_calls: 80    # recalibrated 2026-07-14: 2-specialist (Univ + Cluster)
    max_wall_time_sec: 1200

- id: curriculum-cluster-gap-analysis-rotman
  query: |
    Analyse the University of Toronto Rotman Master of Management
    Analytics (MMA) program curriculum for skill gaps. First fetch the
    current course list, then use the CSPA ensemble clustering results
    to identify which skill clusters are missing or underrepresented.
    Provide a prioritised list of skills to add, with market-demand
    frequencies.
  category: update-curriculum
  # Second Cluster Interpreter case, added 2026-06-25 — added because the
  # coverage audit found only ONE of the 12 real cases above exercised
  # Cluster Interpreter (curriculum-cluster-gap-analysis), vs. 6-8 cases
  # each for the other three specialists. Deliberately uses a DIFFERENT
  # local-corpus program (Rotman MMA, a business-analytics program) rather
  # than re-running Queen's MMAI again, so this is a genuinely distinct
  # gap-analysis scenario, not a duplicate of the existing case.
  #
  # Verified against chatbot/data/program_and_curriculum/uoft-rotman-mma.txt
  # (read in full): Rotman's required+elective courses cover ML/predictive
  # analytics, data structuring/visualization, optimization, LLMs/GenAI,
  # marketing/finance/supply-chain/healthcare analytics — but never mention
  # cloud platforms, cloud databases, or data-pipeline/streaming
  # infrastructure tooling anywhere. Clusters 2 (Cloud Databases & Storage)
  # and 4 (Data Infrastructure & Streaming) are therefore the strongest
  # real-data-backed ❌/⚠️ candidates for this program.
  #
  # Verified against a live cluster_detail(2)/cluster_detail(4) pull
  # (2026-06-25, this sandbox): nearly every skill in clusters 2 and 4 has
  # frequency=0 in Grouped_Skills_Categorized_Updated.xlsx (only "Oracle"
  # at freq=7 is non-zero in cluster 2) — likely a skill-name lookup
  # mismatch between the cluster CSV and the frequency XLSX, a separate,
  # real data-quality issue worth its own investigation later, but NOT
  # something to fix here. Practically, it means there is no large,
  # citable real frequency number to anchor expected_substrings on for
  # clusters 2/4 specifically (unlike "4,278"/"39,040" elsewhere in this
  # file) — a frequency-number assertion would be too brittle.
  #
  # So this case anchors on a structural marker instead: "Data
  # Engineering" is the literal theme name of Cluster 8, which the
  # backstory's required OUTPUT FORMAT ("Cluster Coverage Assessment: for
  # each of the 10 clusters...") makes near-certain to appear verbatim
  # regardless of which specific skill the model chooses to recommend —
  # a more robust check than betting on one stochastic skill pick.
  must_delegate_to:
    - University AI Programs Researcher
    - Cluster Interpreter
  expected_substrings:
    # University AI Programs Researcher must surface Rotman/UofT MMA.
    - "Rotman"
    # Cluster Interpreter must reference the cluster analysis.
    - "cluster"
    # Structural marker: the real Cluster 8 theme name, required to
    # appear in the Cluster Coverage Assessment table by OUTPUT FORMAT
    # regardless of which clusters end up flagged as gaps.
    - "Data Engineering"
  forbidden_substrings: *SHARED_FORBIDDEN
  budget:
    max_tool_calls: 80    # recalibrated 2026-07-14: 2-specialist (Univ + Cluster)
    max_wall_time_sec: 1200
